#!/usr/bin/env atkins
# Atkins CI: https://github.com/titpetric/atkins

name: Vuego CI pipeline

vars:
  name: vuego

jobs:
  default:
    desc: "Format, lint and test"
    steps:
      - task: fmt
      - task: lint
      - task: test
      - task: cover

  fmt:
    desc: "Format the code"
    steps:
      - splint fix ./...
      - go mod tidy

  lint:
    desc: "Lint the code"
    parallel: true
    passthru: true
    steps:
      - splint --linters godoc,pairing,grouping,filecheck,coverage ./... || true

  test:
    desc: "Run built tests"
    passthru: true
    tty: true
    steps:
      - run: gotestsum < test.json
        deferred: true
      - go test -count 1 -cover -coverpkg github.com/titpetric/vuego/... -coverprofile=pkg.cov -json ./... > test.json || true

  cover:
    desc: "Show source coverage"
    steps:
      - defer: rm -f splint.json
      - splint -include-sources -save . || true
      - go-fsck docs -i splint.json > docs/api.md
      # The extract reads the profile itself, so the coverage is in the
      # document splint writes rather than folded in by a second pass over a
      # summary of it. splint exits 1 on a finding, which is not this job.
      - splint -save --append-coverage=pkg.cov ./... || true
      - go-fsck coverage -i splint.json --template=docs/testing-coverage.md.tpl -v > docs/testing-coverage.md
      - perl -pi -e 's/github.com\/titpetric/titpetric/g' docs/testing-coverage.md
      - task: mdox:fmt
